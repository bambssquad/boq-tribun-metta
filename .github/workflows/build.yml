name: verify-site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build the archive and working page
        run: python build_preview.py
      - name: Check quantities, exports and interactions
        run: |
          python validate.py
          node kg_pricing.test.cjs
          node lookback.test.cjs
          node panzoom.test.cjs
      - name: Verify the published files match the source
        run: |
          python publish_public.py
          git diff --exit-code -- index.html tools.html lookback.css lookback.js panzoom.js assets
