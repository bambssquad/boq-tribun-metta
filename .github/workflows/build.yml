name: build-site
on:
  push:
    branches: [main]
    paths: ['src/**', 'src-tribun.zip', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-site
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bongkar sumber (sekali saja)
        run: |
          if [ -f src-tribun.zip ]; then
            mkdir -p src
            unzip -o src-tribun.zip -d src
            rm -f src-tribun.zip
            echo "sumber dibongkar ke src/"
          fi
          ls -la src || true
      - name: Bangun index.html
        run: |
          DEPLOY_OUT="$PWD/_site" DEPLOY_ZIP="-" python src/deploybuild.py
          cp _site/index.html index.html
          touch .nojekyll
          rm -rf _site
          ls -la index.html
      - name: Commit hasil build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "CI: rebuild index.html dari src/" && git push)
