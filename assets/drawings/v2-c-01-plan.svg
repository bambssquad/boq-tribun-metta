jau: infill baru · cokelat: dudukan · biru: tapak tangga · abu-abu gelap: kolom beton</text><text x="40" y="693" class="">R08 mempertahankan dua jalur nominal 600 mm pada dua zona. Lebar efektif belum dikurangi pegangan.</text><text x="40" y="720" class="">Tambahan tempat duduk indikatif: 9 (modul 500 mm; baris ke-4 terpotong kolom beton).</text><text x="40" y="747" class="">Kapasitas total operasi, aksesibilitas dan jalur evakuasi belum disahkan; jumlah zona bukan jumlah pintu keluar.</text><text x="40" y="814" class="small">METTA / R08 / 15 September 2026 / satuan mm / LOD 100 / KOORDINASI KONSEPTUAL — BELUM UNTUK FABRIKASI</text></svg>