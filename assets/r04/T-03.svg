58" y="283.74" font-family="Arial" font-size="8.00" fill="#111">120</text><text x="526.46" y="283.74" font-family="Arial" font-size="8.00" fill="#111">70 pitch</text><text x="526.04" y="317.06" font-family="Arial" font-size="8.00" fill="#111">25 tepi</text><text x="469.22" y="199.55" font-family="Arial" font-size="8.00" fill="#111">RHS / ujung pada x20; baut pada x45</text><text x="539.37" y="220.60" font-family="Arial" font-size="8.00" fill="#111">KUPINGAN SAMPING 6</text><text x="658.64" y="220.60" font-family="Arial" font-size="8.00" fill="#111">PELAT PENERIMA 6</text><text x="539.37" y="374.94" font-family="Arial" font-size="8.00" fill="#111">2 x M12 - lubang14 / baut40 nominal</text><text x="539.37" y="564.37" font-family="Arial" font-size="8.00" fill="#111">SKEMA PASANG / pelat sambungan di luar profil</text><text x="539.37" y="581.91" font-family="Arial" font-size="8.00" fill="#111">Akses kunci &gt;=30; detail penerima mengikuti node rangka</text><text x="539.37" y="599.45" font-family="Arial" font-size="8.00" fill="#111">Dudukan gravitasi dan pengaku stabilitas diperiksa terpisah</text><text x="40.00" y="50.00" font-family="Arial" font-size="18.00" fill="#111">SAP / SELARAS ADHI PERKASA</text><text x="40.00" y="86.00" font-family="Arial" font-size="23.00" fill="#111">T-03  SAMBUNGAN BAUT / LAS BENGKEL</text><text x="940.00" y="49.00" font-family="Arial" font-size="13.00" fill="#111">METTA / R04</text><text x="940.00" y="72.00" font-family="Arial" font-size="12.00" fill="#111">09.09.2026</text><text x="40.00" y="800.00" font-family="Arial" font-size="11.00" fill="#111">mm / NTS | LOD200 koordinasi; detail usulan terukur, belum rilis fabrikasi.</text><text x="40.00" y="697.00" font-family="Arial" font-size="11.00" fill="#111">Usulan kupingan samping6mm 90x120:2bautM12 kelas8.8, lubang14, 2ring/baut; bukan end plate menutup RHS.</text><text x="40.00" y="719.00" font-family="Arial" font-size="11.00" fill="#111">Las sudut kaki3mm di bengkel; panjang efektif dan pelat penerima harus dihitung dari gaya node.</text><text x="40.00" y="741.00" font-family="Arial" font-size="11.00" fill="#111">Baut mengikat kupingan di luar rongga RHS; jangan kencangkan langsung menekan dinding hollow2,3mm.</text></svg>