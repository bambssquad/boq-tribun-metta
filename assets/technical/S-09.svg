ILING &amp; BALUSTRADE</text><text x="905" y="46" font-family="Arial" font-size="12" fill="#1c292c">R03 / 08.09.2026</text><text x="905" y="67" font-family="Arial" font-size="11" fill="#1c292c">LOD 200 / KOORDINASI</text><text x="38" y="806" font-family="Arial" font-size="10" fill="#1c292c">SATUAN: mm | PDF: FIT / NTS | DIMENSI NOMINAL KOORDINASI | DETAIL TERSEDIA DIPERTAHANKAN</text><text x="38" y="727" font-family="Arial" font-size="11">Skema koordinasi: tinggi 1100 mm, bukaan bersih baluster &lt;=100 mm sebagai target studi.</text><text x="38" y="749" font-family="Arial" font-size="11">Beban pagar, pemanjatan, sambungan dan lebar jalur harus diperiksa; ukuran bukan persetujuan.</text><text x="38" y="778" font-family="Arial" font-size="10">LOD 200: bentuk, ukuran dan posisi perkiraan. Detail sambungan mengikuti status masing-masing.</text></svg>