<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="810" viewBox="0 0 1400 810"><rect width="1400" height="810" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172a36}.h{font-size:24px;font-weight:bold}.n{font-size:17px}.small{font-size:14px}</style><text x="40" y="42" class="h">S-02 / Jalur beban dan pilihan profil campuran</text><text x="40" y="70" class="n" fill="#b33322">R06 / STUDI KOORDINASI — BUKAN GAMBAR PELAKSANAAN</text><line x1="70.0" y1="420" x2="70.0" y2="365.0" stroke="#172a36" stroke-width="6"/><line x1="55.0" y1="420" x2="85.0" y2="420" stroke="#172a36" stroke-width="5"/><line x1="70.0" y1="365.0" x2="260.0" y2="365.0" stroke="#247a9a" stroke-width="5"/><line x1="70.0" y1="377.0" x2="260.0" y2="377.0" stroke="#172a36" stroke-width="3"/><line x1="260.0" y1="420" x2="260.0" y2="310.0" stroke="#172a36" stroke-width="6"/><line x1="245.0" y1="420" x2="275.0" y2="420" stroke="#172a36" stroke-width="5"/><line x1="260.0" y1="310.0" x2="450.0" y2="310.0" stroke="#247a9a" stroke-width="5"/><line x1="260.0" y1="322.0" x2="450.0" y2="322.0" stroke="#172a36" stroke-width="3"/><line x1="450.0" y1="420" x2="450.0" y2="255.0" stroke="#172a36" stroke-width="6"/><line x1="435.0" y1="420" x2="465.0" y2="420" stroke="#172a36" stroke-width="5"/><line x1="450.0" y1="255.0" x2="640.0" y2="255.0" stroke="#247a9a" stroke-width="5"/><line x1="450.0" y1="267.0" x2="640.0" y2="267.0" stroke="#172a36" stroke-width="3"/><line x1="640.0" y1="420" x2="640.0" y2="200.0" stroke="#172a36" stroke-width="6"/><line x1="625.0" y1="420" x2="655.0" y2="420" stroke="#172a36" stroke-width="5"/><line x1="640.0" y1="200.0" x2="830.0" y2="200.0" stroke="#247a9a" stroke-width="5"/><line x1="640.0" y1="212.0" x2="830.0" y2="212.0" stroke="#172a36" stroke-width="3"/><line x1="830.0" y1="420" x2="830.0" y2="145.0" stroke="#172a36" stroke-width="6"/><line x1="815.0" y1="420" x2="845.0" y2="420" stroke="#172a36" stroke-width="5"/><line x1="830.0" y1="145.0" x2="1020.0" y2="145.0" stroke="#247a9a" stroke-width="5"/><line x1="830.0" y1="157.0" x2="1020.0" y2="157.0" stroke="#172a36" stroke-width="3"/><line x1="1020.0" y1="420" x2="1020.0" y2="145.0" stroke="#172a36" stroke-width="6"/><line x1="1005.0" y1="420" x2="1035.0" y2="420" stroke="#172a36" stroke-width="5"/><text x="65" y="470" class="n">Potongan lintang:5 tier @1.000 mm; naik @500 mm. Biru=dek; joist tegak lurus bidang gambar.</text><text x="65" y="510" class="n">1. Dek bordes 4 mm → pengaku longitudinal RHS 50×100 @250 mm.</text><text x="65" y="540" class="n">2. Pengaku → balok silang → kolom → base/angkur → struktur beton LT 4.</text><text x="65" y="570" class="n">3. Profil campuran studi: joist 1,6; kolom/balok/bracing 2,3; bentang joist dibatasi hasil audit.</text><text x="65" y="600" class="n">4. Ukuran 100 mm harus tegak pada joist. Putaran profil 90° memerlukan hitung ulang.</text><text x="65" y="630" class="n">5. Pelat dek bukan otomatis diafragma; sambungan pengumpul gaya horizontal harus dibuktikan.</text><text x="65" y="670" class="h">Panjang batang 5 m bukan bentang bebas 5 m. Titik dudukan aktual wajib ditunjukkan pada gamtek.</text><text x="65" y="715" class="n">Sambungan dudukan ke muka hollow tipis: beri jalur bearing ke dinding samping / penguatan lokal.</text><text x="65" y="745" class="n">Dimensi pelat, las, baut dan angkur ditetapkan sesudah gaya tiap sambungan tersedia.</text></svg>