80.000" height="12.000" fill="#a2b3bb" stroke="#385b65" stroke-width="1"/><text x="520" y="153" class="">POTONGAN MELINTANG / tingkat tipikal</text><rect x="520.000" y="182.000" width="480.000" height="60.000" fill="#78a9a0" stroke="#385b65" stroke-width="1"/><text x="1010" y="210" class="small">RHS silang</text><rect x="562.000" y="242.000" width="30.000" height="60.000" fill="#407770" stroke="#385b65" stroke-width="1"/><rect x="562.000" y="302.000" width="30.000" height="200.000" fill="#d79a51" stroke="#385b65" stroke-width="1"/><rect x="535.000" y="502.000" width="84.000" height="5.000" fill="#556979" stroke="#385b65" stroke-width="1"/><rect x="928.000" y="242.000" width="30.000" height="60.000" fill="#407770" stroke="#385b65" stroke-width="1"/><rect x="928.000" y="302.000" width="30.000" height="200.000" fill="#d79a51" stroke="#385b65" stroke-width="1"/><rect x="901.000" y="502.000" width="84.000" height="5.000" fill="#556979" stroke="#385b65" stroke-width="1"/><text x="520" y="542" class="small">Dek 4 / pengaku tinggi 100 / balok tinggi 100 / kolom / base 8 + karet 3</text><text x="440" y="588" class="small">20 kolom baru; 10 balok memanjang; pengaku silang mengikuti daftar potong.</text><text x="440" y="615" class="small">Base usulan 140×150×8; 4 angkur/kolom hanya allowance. Verifikasi lantai wajib.</text><text x="440" y="642" class="small">Takik RC dengan celah 3. Posisi kolom T3/T4 bergeser menghindari beton.</text><text x="440" y="669" class="small">T4: tumpuan depan pada y3300; bagian depan balok menjorok 300 mm.</text><text x="440" y="696" class="small">Periksa kantilever, reaksi lantai, stabilitas, sambungan dan tepi dek di takikan.</text><text x="440" y="723" class="small">Delapan strut pendek dan enam strip dek lama diganti; railing lama dipertahankan.</text><text x="40" y="770" class="small">Elemen infill belum masuk model Revit. Hitungan kuantitas berasal dari geometri usulan pada paket R08.</text><text x="40" y="814" class="small">METTA / R08 / 15 September 2026 / satuan mm / STUDIO KOORDINASI — BELUM UNTUK FABRIKASI</text></svg>